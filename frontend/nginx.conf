# frontend/nginx.conf — Appliance mode (HTTP only, port 80)
# Serves the built Vue SPA and reverse-proxies API paths to the backend
# container (service name "api" in docker-compose.yml).
#
# NOTE: proxy_pass here has NO trailing path (just http://api:3000) so nginx
# forwards the original request URI unmodified — this avoids a classic nginx
# gotcha where a trailing slash on both the location and proxy_pass causes
# unexpected URI rewriting. Location prefixes below intentionally have no
# trailing slash so they match both `/logs` and `/logs/summary`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /auth {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /logs {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /alerts {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ingest {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://api:3000;
    }
}
